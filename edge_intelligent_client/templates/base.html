<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Edge-Side Adaptive Intelligence{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

        <style>
      body {
        padding-top: 4rem;
        background-color: #F5F1E6; /* light cream */
      }
      .navbar-dark.bg-dark {
        background-color: #4B5A2A !important; /* deep olive */
      }
      .card {
        border-radius: 0.5rem;
        border-color: #C7B89A;
      }
      .card-title {
        color: #4B5A2A;
      }
      .metric-good { color: #4B5A2A; }   /* olive green */
      .metric-warn { color: #C76F3B; }   /* warm brown */
      .metric-bad  { color: #B23A48; }   /* muted red */
      a {
        color: #4B5A2A;
      }
      a:hover {
        color: #C76F3B;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Edge Intelligence Demo</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/simulator">Simulator</a></li>
            <li class="nav-item"><a class="nav-link" href="/monitor">Live Monitor</a></li>
            <li class="nav-item"><a class="nav-link" href="/comparison">Comparison</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        {% block content_scripts %}{% endblock %}

  </body>
</html>
